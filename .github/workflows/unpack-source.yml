name: Assemble and publish source

on:
  workflow_dispatch:
  push:
    paths:
      - 'source/READY'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reassemble uploaded archives
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p source downloads
          cat source/source.zip.b64.part* | base64 -d > source/SuccessoPlayer_Android_v3.3_FiltroAscoltate_Source.zip
          cat source/package.zip.b64.part* | base64 -d > downloads/SuccessoPlayer_Pacchetto_Completo_v21_FiltroAscoltate.zip
          unzip -tq source/SuccessoPlayer_Android_v3.3_FiltroAscoltate_Source.zip
          unzip -tq downloads/SuccessoPlayer_Pacchetto_Completo_v21_FiltroAscoltate.zip

      - name: Publish Android source tree
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .unpack-source
          mkdir .unpack-source
          unzip -q source/SuccessoPlayer_Android_v3.3_FiltroAscoltate_Source.zip -d .unpack-source
          SETTINGS="$(find .unpack-source -name settings.gradle -type f -print -quit)"
          test -n "$SETTINGS"
          ROOT="$(dirname "$SETTINGS")"

          rm -rf app gradle
          cp -a "$ROOT/app" ./app
          cp -a "$ROOT/gradle" ./gradle

          for f in build.gradle gradle.properties settings.gradle VERSION.txt PACCHETTO_INFO.txt LEGGIMI.txt; do
            if [ -f "$ROOT/$f" ]; then cp -f "$ROOT/$f" "./$f"; fi
          done

      - name: Publish Windows builder helpers
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .unpack-builder
          mkdir .unpack-builder builder
          unzip -q -o downloads/SuccessoPlayer_Pacchetto_Completo_v21_FiltroAscoltate.zip -d .unpack-builder
          find .unpack-builder -maxdepth 1 -type f \( -name '*.ps1' -o -name '*.bat' -o -name 'LEGGIMI*.txt' \) -exec cp -f {} builder/ \;

      - name: Clean temporary upload chunks
        shell: bash
        run: |
          rm -rf .unpack-source .unpack-builder
          rm -f source/source.zip.b64.part* source/package.zip.b64.part* source/READY

      - name: Commit published project
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to publish."
          else
            git commit -m "Publish Successo Player Android v3.3"
            git push
          fi

name: Build Successo Player APK aggiornabile

on:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "tools/**"
      - "windows-builder/**"
      - "build.gradle"
      - "gradle.properties"
      - "settings.gradle"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: successo-player-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-powershell:
    name: Verifica sintassi PowerShell 5.1
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verifica parser script di firma
        shell: powershell
        run: |
          $file = Join-Path $PWD 'windows-builder\CONFIGURA_FIRMA_GITHUB.ps1'
          $tokens = $null
          $parseErrors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            $file, [ref]$tokens, [ref]$parseErrors
          )
          if ($parseErrors.Count -gt 0) {
            foreach ($err in $parseErrors) {
              Write-Host ("Errore alla riga {0}: {1}" -f $err.Extent.StartLineNumber, $err.Message)
            }
            exit 1
          }
          Write-Host "Sintassi PowerShell corretta."

  build-apk:
    name: APK firmato permanente
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Locate Android sdkmanager
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager non trovato"
            exit 1
          fi
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          "$SDKMANAGER" --version

      - name: Install Android SDK 36
        shell: bash
        run: |
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Verifica presenza della firma permanente
        shell: bash
        env:
          SUCCESSO_KEYSTORE_BASE64: ${{ secrets.SUCCESSO_KEYSTORE_BASE64 }}
          SUCCESSO_KEYSTORE_PASSWORD: ${{ secrets.SUCCESSO_KEYSTORE_PASSWORD }}
          SUCCESSO_KEY_ALIAS: ${{ secrets.SUCCESSO_KEY_ALIAS }}
          SUCCESSO_KEY_PASSWORD: ${{ secrets.SUCCESSO_KEY_PASSWORD }}
          SUCCESSO_CERT_SHA256: ${{ secrets.SUCCESSO_CERT_SHA256 }}
        run: |
          for key in SUCCESSO_KEYSTORE_BASE64 SUCCESSO_KEYSTORE_PASSWORD SUCCESSO_KEY_ALIAS SUCCESSO_KEY_PASSWORD SUCCESSO_CERT_SHA256; do
            if [ -z "${!key}" ]; then
              echo "::error::Firma non configurata: manca $key. Eseguire windows-builder/CONFIGURA_FIRMA_GITHUB.ps1 una sola volta."
              exit 1
            fi
          done
          printf '%s' "$SUCCESSO_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/successo-update.keystore"
          chmod 600 "$RUNNER_TEMP/successo-update.keystore"

      - name: Imposta versionCode crescente ad ogni compilazione
        shell: bash
        run: |
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          path = Path('app/build.gradle')
          gradle = path.read_text(encoding='utf-8')
          # Il contatore GitHub e' persistente tra esecuzioni della stessa workflow.
          # La base 42400 della v4.24 supera tutte le build 423xx già pubblicate.
          code = 42400 + int(os.environ['GITHUB_RUN_NUMBER'])
          assert code > 42352 and code < 2100000000
          gradle, changed = re.subn(r'versionCode\s+\d+', f'versionCode {code}', gradle, count=1)
          assert changed == 1
          path.write_text(gradle, encoding='utf-8')
          version = re.search(r"versionName\s+['\"]([^'\"]+)['\"]", gradle).group(1)
          with open(os.environ['GITHUB_ENV'], 'a') as f:
            f.write(f"SUCCESSO_APK_VERSION={version}\nSUCCESSO_APK_CODE={code}\n")
          print(f"Successo Player {version}, versionCode {code}")
          PY

      - name: Verifica 2253 proverbi distinti
        shell: bash
        run: python3 tools/check_proverbs.py

      - name: Verifica migrazione ricerca e filtri
        shell: bash
        run: python3 tools/check_search_removed.py

      - name: Verifica navigazione ricerca e finestre aggiornamenti in primo piano
        shell: bash
        run: python3 tools/check_navigation_and_update_lifecycle.py

      - name: Verifica nessuna ripresa automatica dopo Pausa
        shell: bash
        run: python3 tools/check_pause_persistence.py

      - name: Verifica motore Media3, rete, Bluetooth e chiamate
        shell: bash
        run: python3 tools/check_media3_audio_engine.py

      - name: Verifica uscita completa e pulizia media
        shell: bash
        run: python3 tools/check_app_exit.py

      - name: Verifica rimozione pulsanti intestazione
        shell: bash
        run: python3 tools/check_header_buttons_removed.py

      - name: Verifica pulsante cartella download
        shell: bash
        run: python3 tools/check_download_folder_button.py

      - name: Verifica comandi compatti e diretta da switch
        shell: bash
        run: python3 tools/check_compact_live_switch.py

      - name: Verifica pulsante a due stati per la diretta
        shell: bash
        run: python3 tools/check_styled_live_button.py

      - name: Verifica fascia diretta, countdown e connessione
        shell: bash
        run: python3 tools/check_live_program_status.py

      - name: Verifica scroll automatico Shuffle
        shell: bash
        run: python3 tools/check_shuffle_scroll.py

      - name: Verifica Shuffle intelligente senza ripetizioni
        shell: bash
        run: python3 tools/check_smart_shuffle.py

      - name: Verifica ripresa per episodio e aggiornamenti GitHub
        shell: bash
        run: python3 tools/check_episode_resume_and_updates.py

      - name: Verifica controllo aggiornamenti a ogni accesso
        shell: bash
        run: python3 tools/check_update_every_open.py

      - name: Verifica download APK completo e installazione verificata
        shell: bash
        run: python3 tools/check_verified_apk_update.py

      - name: Verifica libreria download e riproduzione offline
        shell: bash
        run: python3 tools/check_offline_episode_library.py

      - name: Verifica coda di riproduzione personalizzata
        shell: bash
        run: python3 tools/check_playback_queue.py

      - name: Verifica ricerca rapida e filtri combinati
        shell: bash
        run: python3 tools/check_catalog_search.py

      - name: Verifica Sleep Timer e fine puntata
        shell: bash
        run: python3 tools/check_sleep_timer.py

      - name: Verifica cronologia degli ascolti e ripresa
        shell: bash
        run: python3 tools/check_playback_history.py

      - name: Verifica menu a tendina con cinque funzioni
        shell: bash
        run: python3 tools/check_overflow_menu.py

      - name: Compila release (non firmata)
        shell: bash
        run: gradle --no-daemon --stacktrace :app:assembleRelease

      - name: Firma e verifica certificato permanente
        shell: bash
        env:
          SUCCESSO_KEYSTORE_PASSWORD: ${{ secrets.SUCCESSO_KEYSTORE_PASSWORD }}
          SUCCESSO_KEY_ALIAS: ${{ secrets.SUCCESSO_KEY_ALIAS }}
          SUCCESSO_KEY_PASSWORD: ${{ secrets.SUCCESSO_KEY_PASSWORD }}
          SUCCESSO_CERT_SHA256: ${{ secrets.SUCCESSO_CERT_SHA256 }}
        run: |
          set -euo pipefail
          tools="$ANDROID_HOME/build-tools/35.0.0"
          input="app/build/outputs/apk/release/app-release-unsigned.apk"
          test -f "$input"
          mkdir -p release
          "$tools/zipalign" -f -p 4 "$input" "$RUNNER_TEMP/aligned.apk"
          signed="release/SuccessoPlayer_Android_v${SUCCESSO_APK_VERSION}_build${SUCCESSO_APK_CODE}.apk"
          "$tools/apksigner" sign \
            --ks "$RUNNER_TEMP/successo-update.keystore" \
            --ks-key-alias "$SUCCESSO_KEY_ALIAS" \
            --ks-pass env:SUCCESSO_KEYSTORE_PASSWORD \
            --key-pass env:SUCCESSO_KEY_PASSWORD \
            --out "$signed" "$RUNNER_TEMP/aligned.apk"
          "$tools/apksigner" verify --verbose --print-certs "$signed"
          actual=$("$tools/apksigner" verify --print-certs "$signed" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -1)
          actual=$(printf '%s' "$actual" | tr -d ': \r' | tr '[:upper:]' '[:lower:]')
          expected=$(printf '%s' "$SUCCESSO_CERT_SHA256" | tr -d ': \r' | tr '[:upper:]' '[:lower:]')
          if [ -z "$actual" ] || [ "$actual" != "$expected" ]; then
            echo "::error::Certificato APK inatteso: build bloccata per evitare aggiornamenti incompatibili."
            exit 1
          fi
          sha256sum "$signed" > release/SHA256.txt
          echo "Firma permanente verificata, versionCode: $SUCCESSO_APK_CODE"
          ls -lh release

      - name: Pubblica APK aggiornabile
        uses: actions/upload-artifact@v4
        with:
          name: SuccessoPlayer-Android-Update-APK
          path: |
            release/*.apk
            release/SHA256.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Pubblica automaticamente su GitHub Releases
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="v${SUCCESSO_APK_VERSION}-build${SUCCESSO_APK_CODE}"
          apk="release/SuccessoPlayer_Android_v${SUCCESSO_APK_VERSION}_build${SUCCESSO_APK_CODE}.apk"
          test -s "$apk"
          # Il nome fisso permette a tutti di usare /releases/latest/download/...
          cp "$apk" release/SuccessoPlayer_Android_latest.apk
          cat > release/RELEASE_NOTES.md <<EOF
          # Successo Player Android v${SUCCESSO_APK_VERSION} (build ${SUCCESSO_APK_CODE})

          APK Android firmato con la chiave permanente del progetto.

          - Posizione di ascolto indipendente per ciascuna puntata.
          - Puntate su Media3/ExoPlayer 1.11.1, con riconnessioni limitate e ripresa dal segnalibro.
          - Audio in pausa se cuffie/Bluetooth vengono scollegati, audio focus rispettato durante le chiamate.
          - Diretta compatta: countdown e connessione all'interno del pulsante da 48dp; nessuna riga aggiuntiva.
          - Controllo aggiornamenti a ogni accesso nel menu ⋮ in alto a destra.
          - Tasto Indietro chiude prima la ricerca, senza interrompere l'ascolto.
           - Finestre di aggiornamento mostrate solo con app in primo piano.
           - Pubblicazione automatica di ogni build firmata con link di download stabile.
          - Installabile sopra la versione precedente senza eliminare dati.

          Controlli: firma APK verificata e SHA-256 in allegato.

          Progetto indipendente non ufficiale, non affiliato alla Rai.
          EOF
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # Un rerun dello stesso workflow non sovrascrive una release già pubblicata.
            echo "La Release $tag esiste già; nessuna modifica agli allegati."
          else
            gh release create "$tag" \
              "$apk" \
              "release/SuccessoPlayer_Android_latest.apk" \
              "release/SHA256.txt" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Successo Player Android v${SUCCESSO_APK_VERSION} (build ${SUCCESSO_APK_CODE})" \
              --notes-file release/RELEASE_NOTES.md \
              --latest
          fi
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json url,assets \
            --jq '{url, assets: [.assets[].name]}'

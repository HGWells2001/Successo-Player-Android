plugins {
    id 'com.android.application'
}

android {
    namespace 'it.successoplayer.app'
    compileSdk 36

    defaultConfig {
        applicationId 'it.successoplayer.app'
        minSdk 26
        targetSdk 35
        versionCode 42400
        versionName '4.24'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Stable Media3 1.11.1; maintain the existing Android MediaSession and UI.
    implementation 'androidx.media3:media3-exoplayer:1.11.1'
}

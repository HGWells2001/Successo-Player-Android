plugins {
    id 'com.android.application'
}

android {
    namespace 'it.successoplayer.app'
    compileSdk 35

    defaultConfig {
        applicationId 'it.successoplayer.app'
        minSdk 26
        targetSdk 35
        versionCode 3500
        versionName '3.5'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
